# Local stack for development and the demo: Postgres + the API on :8000.
#   docker compose up -d --build
#   docker compose exec api python -m jarvis_api.seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis # local-only throwaway credentials
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    env_file:
      - path: ./api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://jarvis:jarvis@db:5432/jarvis
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account
      PORT: "8080"
    secrets:
      - firebase-service-account
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn jarvis_api.main:app --host 0.0.0.0 --port 8080"]

secrets:
  firebase-service-account:
    # Gitignored. See docs/SETUP.md section 5 for how to download it.
    file: ./api/firebase-service-account.json

volumes:
  jarvis-pg:
